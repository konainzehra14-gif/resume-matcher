<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Matcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1846;--muted:#6a6996;--paper:#f5f4fb;--line:#e3e1f3;--violet:#6c5ce7;--indigo:#1f1b5c;--mint:#1fc8a3;--amber:#f5a524;--rose:#f0506e;--r:18px}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3,.big{font-family:"Bricolage Grotesque",sans-serif;margin:0;line-height:1.08}
.hero{background:radial-gradient(900px 400px at 85% -10%,#7a5cff88,transparent 60%),radial-gradient(600px 300px at 0% 100%,#1fc8a355,transparent 60%),var(--indigo);color:#fff;padding:36px 24px 120px}
.wrap{max-width:1180px;margin:0 auto}
.nav{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.logo{display:flex;align-items:center;gap:10px;font:800 20px "Bricolage Grotesque"}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--violet),var(--mint));display:grid;place-content:center;font-style:normal}
.db{font-size:14px;display:flex;align-items:center;gap:8px;background:#ffffff18;padding:6px 14px;border-radius:999px}
.dot{width:9px;height:9px;border-radius:50%;background:#aaa}.dot.on{background:var(--mint);box-shadow:0 0 0 4px #1fc8a333}.dot.off{background:var(--rose)}
.hero h1{font-size:clamp(34px,6vw,64px);font-weight:800;max-width:15ch;margin-top:48px;letter-spacing:-.02em}
.hero p{color:#cfcdf5;font-size:18px;max-width:50ch;margin:16px 0 0}
.form{max-width:1180px;margin:-84px auto 0;padding:0 24px;position:relative}
.panel{background:#fff;border-radius:24px;padding:24px;box-shadow:0 24px 60px -20px #1f1b5c55;display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:820px){.panel{grid-template-columns:1fr}}
.panel h2{font-size:18px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.step{width:26px;height:26px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-content:center;font-size:14px}
.drop{border:2px dashed #c9c4f2;border-radius:14px;padding:22px;text-align:center;cursor:pointer;background:#faf9ff;transition:.2s}
.drop:hover,.drop.over{border-color:var(--violet);background:#f0edff}
.drop b{display:block;font-size:15px}.drop span{font-size:13px;color:var(--muted)}
.drop.has{border-style:solid;border-color:var(--mint);background:#effcf8}
textarea{width:100%;margin-top:12px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;color:inherit;resize:vertical;min-height:120px;background:#fff}
.jd textarea{margin-top:0;min-height:236px}
textarea:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 4px #6c5ce722}
button:focus-visible,.h:focus-visible,.drop:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.actions{grid-column:1/-1;display:flex;gap:12px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.ghost{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:12px 18px;font:600 15px "Instrument Sans";cursor:pointer}
.go{border:0;border-radius:12px;padding:14px 30px;font:600 16px "Instrument Sans";color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--violet),#8b6dff);box-shadow:0 10px 24px -8px #6c5ce7aa}
.go:disabled{opacity:.7;cursor:wait}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
.err{grid-column:1/-1;background:#fff0f3;color:#9c2440;border-radius:12px;padding:10px 14px;font-size:14px}
section.res{max-width:1180px;margin:32px auto 0;padding:0 24px}
.grid{display:grid;grid-template-columns:380px 1fr;gap:20px;margin-top:20px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border-radius:var(--r);padding:24px;border:1px solid var(--line)}
.score{background:linear-gradient(160deg,var(--indigo),#3b2fa0);color:#fff;border:0}
.gauge{position:relative;width:210px;height:210px;margin:0 auto}
.gauge svg{transform:rotate(-90deg);filter:drop-shadow(0 0 14px var(--gc,#6c5ce7aa))}
.gauge circle{fill:none;stroke-width:14;stroke-linecap:round}
.gauge .fg{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.gauge .big{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:64px;font-weight:800}
.gauge small{font:500 13px "Instrument Sans";color:#bdb9ee}
.pill{display:block;text-align:center;margin:14px auto 20px;width:max-content;padding:5px 16px;border-radius:999px;font-weight:600;font-size:14px;color:#fff}
.bar{margin-top:12px;font-size:14px}.bar div:first-child{display:flex;justify-content:space-between;color:#d8d5fa;margin-bottom:4px}
.track{height:7px;background:#ffffff22;border-radius:8px;overflow:hidden}.track i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--mint),#7ee8d0);transition:width 1s}
.meta{margin-top:18px;font-size:13px;color:#bdb9ee;border-top:1px solid #ffffff22;padding-top:12px}
.card h2{font-size:20px;margin-bottom:14px}
.grp{margin-bottom:16px}.grp h3{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:5px 13px;border-radius:999px;font-size:14px;font-weight:500}
.chip.ok{background:#e0f8f1;color:#0b7a60}.chip.mid{background:#fff3dc;color:#8a5a06}.chip.bad{background:#ffe6eb;color:#a3213f}
.chip em{font-style:normal;opacity:.75}
.none{color:var(--muted);font-size:14px}
.recs{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.recs li{display:flex;gap:12px;padding:14px;border-radius:14px;background:var(--paper);font-size:15px}
.recs li b{flex:none;width:26px;height:26px;border-radius:8px;background:var(--violet);color:#fff;display:grid;place-content:center;font-size:13px}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.histbar{max-width:1180px;margin:40px auto 60px;padding:0 24px}
.histbar h2{font-size:20px;margin-bottom:12px}
.hl{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.h{flex:none;width:230px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;position:relative;transition:.2s}
.h:hover{transform:translateY(-3px);box-shadow:0 12px 24px -12px #1f1b5c44}
.h b{font:800 26px "Bricolage Grotesque"}.h span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h button{position:absolute;top:8px;right:8px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}
.jf{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.jf input[type=text]{flex:1;min-width:150px;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit}
.jf input[type=text]:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 4px #6c5ce722}
.jf label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.job{display:flex;gap:16px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:14px;margin-top:12px}
.job>b{flex:none;width:54px;height:54px;border-radius:14px;color:#fff;display:grid;place-content:center;font:800 20px "Bricolage Grotesque"}
.job h3{font-size:17px}.job p{margin:2px 0 8px;font-size:14px;color:var(--muted)}
.job .chips{margin-top:6px}.job .chip{font-size:13px;padding:3px 10px}
.job .body{flex:1;min-width:0}
a.ghost{display:inline-block;text-decoration:none;white-space:nowrap}
a.go{display:inline-block;text-decoration:none;padding:10px 20px;margin:0;font-size:15px;white-space:nowrap}
@media(max-width:640px){.job{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="hero"><div class="wrap">
  <div class="nav"><div class="logo"><i>✦</i>Resume Matcher</div><div class="db"><span class="dot" id="dot"></span><span id="dbtxt">Checking database</span></div></div>
  <h1>Does your resume fit the job?</h1>
  <p>Upload a resume, paste a job posting, and see your match score, skill gaps and exactly what to fix.</p>
</div></div>

<div class="form"><div class="panel">
  <div>
    <h2><span class="step">1</span>Your resume</h2>
    <div class="drop" id="drop" tabindex="0" role="button"><b id="dropt">Drop a PDF or DOCX here</b><span id="dropx">or select a file from your computer</span></div>
    <input type="file" id="file" accept=".pdf,.docx,.txt" hidden>
    <textarea id="rtext" placeholder="Or paste your resume text here"></textarea>
  </div>
  <div class="jd">
    <h2><span class="step">2</span>Job description</h2>
    <textarea id="jd" placeholder="Paste the full job posting, including requirements and nice-to-haves"></textarea>
  </div>
  <div class="err" id="err" hidden></div>
  <div class="actions"><button class="ghost" id="sample">Try sample data</button><button class="go" id="go">Analyze match</button></div>
</div></div>

<section class="res" id="out" hidden></section>

<div class="histbar"><h2>Saved analyses</h2><div class="hl" id="hist"></div></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clr=s=>s>=70?"#1fc8a3":s>=45?"#f5a524":"#f0506e";
const label=s=>s>=70?"Strong fit":s>=45?"Partial fit":"Low fit";
const SAMPLE_R=`Ayesha Khan - Software Engineer
5 years of experience building backend services.
Skills: Python, Django, PostgreSQL, Docker, Git, REST APIs, AWS, Agile
2021 - Present: Backend Engineer, built APIs serving 200k users and cut response time by 40%.
2019 - 2021: Junior Developer, worked with MySQL and Linux.
Education: Bachelor of Science in Computer Science`;
const SAMPLE_J=`Senior Backend Engineer
Requirements:
- 4+ years of experience in Python
- Strong knowledge of FastAPI or Flask, and REST APIs
- Experience with PostgreSQL and MongoDB
- Docker and Kubernetes in production
- CI/CD pipelines
- Bachelor's degree in Computer Science
Nice to have:
- GCP or Azure
- Kafka`;
async function health(){try{const r=await(await fetch("/api/health")).json();$("dot").className="dot "+(r.mongo?"on":"off");$("dbtxt").textContent=r.mongo?"MongoDB connected":"MongoDB unreachable"}catch{$("dbtxt").textContent="Server unreachable"}}
async function history(){
  const rows=await(await fetch("/api/analyses")).json();
  $("hist").innerHTML=rows.length?rows.map(r=>`<div class="h" tabindex="0" data-id="${r.id}"><b style="color:${clr(r.score)}">${r.score}</b><span>${esc(r.title)}</span><span>${new Date(r.created_at).toLocaleDateString()}</span><button aria-label="Delete analysis" data-del="${r.id}">×</button></div>`).join(""):`<p class="none">Nothing saved yet. Each analysis you run is stored here.</p>`;
}
const chips=(a,cls,f)=>a.length?`<div class="chips">${a.map(x=>`<span class="chip ${cls}">${f(x)}</span>`).join("")}</div>`:`<p class="none">None</p>`;
function render(r,scroll){
  const C=2*Math.PI*90,b=r.breakdown,ex=r.experience,c=clr(r.score);
  const o=$("out");o.hidden=false;
  o.innerHTML=`<div class="grid">
  <div class="card score"><div class="gauge" style="--gc:${c}88"><svg width="210" height="210" viewBox="0 0 210 210"><circle cx="105" cy="105" r="90" stroke="#ffffff22"/><circle class="fg" cx="105" cy="105" r="90" stroke="${c}" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div class="big"><span id="num">0</span><small>out of 100</small></div></div>
  <span class="pill" style="background:${c}">${label(r.score)}</span>
  ${[["Skills",b.skills],["Wording similarity",b.semantic],["Experience",b.experience],["Education",b.education]].map(([n,v])=>`<div class="bar"><div><span>${n}</span><span>${v}%</span></div><div class="track"><i style="width:0" data-w="${v}"></i></div></div>`).join("")}
  <div class="meta">Experience: ${ex.have} yrs found${ex.need?`, ${ex.need} requested`:""}<br>Education: ${esc(r.education.have)}${r.education.need!=="Not found"?`, ${esc(r.education.need)} requested`:""}</div></div>
  <div style="display:grid;gap:20px;align-content:start">
    <div class="card"><h2>Requirements</h2>
      <div class="grp"><h3>✅ Matched (${r.matched.length})</h3>${chips(r.matched,"ok",esc)}</div>
      <div class="grp"><h3>🔁 Related only (${r.partial.length})</h3>${chips(r.partial,"mid",p=>`${esc(p.required)} <em>via ${esc(p.found)}</em>`)}</div>
      <div class="grp" style="margin:0"><h3>❌ Missing (${r.missing.length})</h3>${chips(r.missing,"bad",esc)}${r.nice_missing.length?`<p class="note">Nice-to-have, also missing: ${r.nice_missing.map(esc).join(", ")}</p>`:""}</div></div>
    <div class="card"><h2>What to change</h2><ul class="recs">${r.recommendations.map((t,i)=>`<li><b>${i+1}</b><span>${esc(t)}</span></li>`).join("")}</ul>
    ${typeof r.ai_tips==="string"?`<p class="note">The first suggestions were written by ${esc(r.ai_tips)} from your resume (contact details removed).</p>`:""}${r.ai_error?`<p class="note">AI suggestions were not added: ${esc(r.ai_error)}</p>`:""}</div>
    <div class="card"><h2>Find matching jobs</h2><div class="jf"><input type="text" id="jq" value="${esc(r.job_title)}" aria-label="Job title"><input type="text" id="jl" value="Pakistan" aria-label="Location"><a class="ghost" id="jlink" target="_blank" rel="noopener noreferrer">Open on LinkedIn</a><button class="go" id="jgo">Search jobs</button></div><p class="note">Open on LinkedIn searches LinkedIn directly. Search jobs lists free remote jobs from Remotive, scored against your resume.</p><div id="jobs"></div></div>
  </div></div>`;
  updateLi();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    o.querySelector(".fg").style.strokeDashoffset=C*(1-r.score/100);
    o.querySelectorAll(".track i").forEach(i=>i.style.width=i.dataset.w+"%");
    const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1100);$("num").textContent=Math.round(r.score*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0);
  }));
  if(scroll)o.scrollIntoView({behavior:"smooth",block:"start"});
}
const drop=$("drop");
function setFile(f){if(!f)return;const dt=new DataTransfer();dt.items.add(f);$("file").files=dt.files;drop.classList.add("has");$("dropt").textContent=f.name;$("dropx").textContent="Ready to analyze. Select to change the file."}
drop.onclick=()=>$("file").click();
drop.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("file").click()}};
$("file").onchange=e=>setFile(e.target.files[0]);
["dragover","dragenter"].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",e=>setFile(e.dataTransfer.files[0]));
$("sample").onclick=()=>{$("rtext").value=SAMPLE_R;$("jd").value=SAMPLE_J};
$("go").onclick=async()=>{
  const fd=new FormData();fd.append("job_description",$("jd").value);fd.append("resume_text",$("rtext").value);
  if($("file").files[0])fd.append("resume_file",$("file").files[0]);
  $("err").hidden=true;$("go").disabled=true;$("go").innerHTML='<span class="spin"></span>Analyzing';
  try{
    const res=await fetch("/api/analyze",{method:"POST",body:fd}),d=await res.json();
    if(!res.ok)throw new Error(d.detail||"Something went wrong.");
    KEY=d.resume_key;render(d.result,true);history();
    if(!d.saved){$("err").textContent="Analysis done, but MongoDB is unreachable so it wasn't saved. Check MONGO_URI.";$("err").hidden=false}
  }catch(e){$("err").textContent=e.message;$("err").hidden=false}
  $("go").disabled=false;$("go").textContent="Analyze match";
};
$("hist").onclick=async e=>{
  const del=e.target.dataset.del,h=e.target.closest(".h");if(!h)return;
  if(del){await fetch("/api/analyses/"+del,{method:"DELETE"});return history()}
  KEY=null;render((await(await fetch("/api/analyses/"+h.dataset.id)).json()).result,true);
};
$("hist").onkeydown=e=>{if(e.key==="Enter"&&e.target.classList.contains("h"))e.target.click()};

let KEY=null;
$("out").onclick=async e=>{
  if(e.target.id!=="jgo")return;
  const b=e.target,box=$("jobs");
  if(!KEY){box.innerHTML='<p class="note">Run a new analysis first. Your resume text is not stored, so saved reports can\'t search for jobs.</p>';return}
  const fd=new FormData();fd.append("resume_key",KEY);fd.append("query",$("jq").value);fd.append("location",$("jl").value);fd.append("linkedin_only",true);
  b.disabled=true;b.innerHTML='<span class="spin"></span>Searching';
  try{
    const res=await fetch("/api/jobs",{method:"POST",body:fd}),d=await res.json();
    if(!res.ok)throw new Error(d.detail||"Something went wrong.");
    box.innerHTML=d.jobs.length?d.jobs.map(j=>`<div class="job"><b style="background:${clr(j.score)}">${j.score}</b><div class="body"><h3>${esc(j.title)}</h3><p>${esc(j.company)}${j.location?" · "+esc(j.location):""}${j.source?" · via "+esc(j.source):""}</p>
      <div class="chips">${j.matched.map(s=>`<span class="chip ok">${esc(s)}</span>`).join("")}${j.missing.map(s=>`<span class="chip bad">${esc(s)}</span>`).join("")}</div></div>
      <a class="go" href="${esc(j.link)}" target="_blank" rel="noopener noreferrer">Apply</a></div>`).join("")+`<p class="note">Jobs from ${esc(d.provider)}. Apply opens the original listing.</p>`:'<p class="note">No jobs found. Try a broader title (like Python Developer) or clear the location box.</p>';
  }catch(err){box.innerHTML=`<div class="err" style="margin-top:12px">${esc(err.message)}</div>`}
  b.disabled=false;b.textContent="Search jobs";
};

function updateLi(){const q=$("jq"),l=$("jl"),a=$("jlink");if(q&&a)a.href="https://www.linkedin.com/jobs/search/?keywords="+encodeURIComponent(q.value)+"&location="+encodeURIComponent(l.value)}
$("out").oninput=updateLi;
health();history();
</script>
</body>
</html>
